# SonarCloud: misma organización que la app Android (blackmouthriver_DocuSmart).
sonar.organization=blackmouthriver
sonar.projectKey=blackmouthriver_docusmart-web
sonar.projectName=DocuSmart Web

sonar.sources=src,index.html,app/index.html
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,public/**,dist/**,coverage/**,scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# La lógica (src/app/lib, src/shared) se mide con pruebas unitarias; las pantallas
# de React se validan de punta a punta en el navegador, no con cobertura unitaria.
sonar.coverage.exclusions=src/app/screens/**,src/app/components/**,src/app/App.tsx,src/app/main.tsx,src/landing/**,src/shared/consent.ts,src/shared/fonts.ts

sonar.sourceEncoding=UTF-8
