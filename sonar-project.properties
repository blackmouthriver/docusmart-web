# SonarCloud: misma organización que la app Android (blackmouthriver_DocuSmart).
sonar.organization=blackmouthriver
sonar.projectKey=blackmouthriver_docusmart-web
sonar.projectName=DocuSmart Web

# Código en src/, páginas de entrada en site/ y pruebas en tests/.
sonar.sources=src,site/index.html,site/app/index.html
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.exclusions=public/**,dist/**,coverage/**,scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Cobertura por capas:
#   - core/ y shared/ (lógica pura) se miden con pruebas unitarias en tests/unit.
#   - ui/ (pantallas React), infra/ (canvas, wasm y APIs del navegador) y entries/
#     se validan de punta a punta en el navegador, no con cobertura unitaria.
sonar.coverage.exclusions=src/entries/**,src/app/App.tsx,src/features/*/ui/**,src/features/*/infra/**,src/shared/ui/**,src/shared/cloud/cloudPopup.ts,src/shared/platform/consent.ts,src/shared/platform/fonts.ts

sonar.sourceEncoding=UTF-8
