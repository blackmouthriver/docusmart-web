name: CI

# Flujo de ramas (desde 2026-11-25): los PR se fusionan a `preproduccion`; ahí se juntan varios
# cambios y se verifican. A `main` (producción) se pasan en paquete, como mucho una vez al día o
# cuando haga falta, y solo `main` despliega a docusmart.online.
on:
  push:
    branches: [main, preproduccion]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, pruebas y SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarCloud necesita el historial para el "new code"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Auditoría de dependencias de producción
        run: npm run audit

      - name: Páginas de herramientas al día
        run: npm run pages:check

      - name: Pruebas con cobertura
        run: npm run test:coverage

      - name: Build (incluye verificación de tipos)
        run: npm run build

      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0

      - name: Aviso si falta SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Falta el secreto SONAR_TOKEN; se omitió el análisis de SonarCloud."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 7

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pruebas de punta a punta (W-11): un navegador real contra el build servido con las cabeceras
  # de producción. Si fallan, no se publica.
  e2e:
    name: Pruebas de punta a punta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas de punta a punta
        run: npm run test:e2e

      - name: Reporte de Playwright (si fallan)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # W-150.3: el motor de Safari (WebKit) en una Mac de verdad, para DocuSmart Desktop en macOS. Corre en los PR a
  # producción (main), que llevan el paquete de preproducción: tarda unos 20 minutos y así no demora cada PR.
  # Lo que Playwright no puede simular en WebKit (la cámara, el salto de la ventana de Drive y Dropbox) se omite ahí.
  safari:
    name: Safari en Mac (WebKit)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Navegador WebKit de Playwright
        run: npx playwright install --with-deps webkit

      - name: Pruebas de punta a punta en WebKit
        run: npx playwright test --project safari
        env:
          WEBKIT: '1'

      - name: Reporte de WebKit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safari-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Desplegar en Firebase Hosting
    needs: [build, secrets, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://docusmart.online
    env:
      # `firebase init hosting:github` crea el secreto con este nombre.
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCUSMART_8904E != '' }}
    steps:
      - name: Aviso si falta la cuenta de servicio
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT_DOCUSMART_8904E; se omitió el despliegue."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_FIREBASE_SA == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: env.HAS_FIREBASE_SA == 'true'

      # Se recompila con la configuración de Firebase guardada como secretos del entorno.
      - name: Build de producción
        if: env.HAS_FIREBASE_SA == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: docusmart-8904e.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: docusmart-8904e
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      # IndexNow (W-152): se guarda el sitemap publicado antes de desplegar, para avisar solo lo que cambió.
      # Si la clave aún no estaba publicada (primer despliegue con IndexNow), no se guarda y se avisan todas.
      - name: Sitemap publicado antes del despliegue
        if: env.HAS_FIREBASE_SA == 'true'
        run: |
          KEY=$(node -e "import('./scripts/indexnow.mjs').then((m) => console.log(m.INDEXNOW_KEY))")
          if curl -fsS --max-time 20 "https://docusmart.online/$KEY.txt" > /dev/null; then
            curl -fsS --max-time 20 https://docusmart.online/sitemap.xml -o "$RUNNER_TEMP/sitemap-anterior.xml" || echo "::warning::No se pudo leer el sitemap publicado; IndexNow avisará todas las URL."
          else
            echo "La clave de IndexNow aún no estaba publicada: se avisarán todas las URL."
          fi

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCUSMART_8904E }}
          projectId: docusmart-8904e
          channelId: live

      # Bing, Yandex y los demás buscadores de IndexNow se enteran al momento de lo nuevo. Nunca hace fallar el despliegue.
      - name: Avisar a IndexNow las páginas nuevas o cambiadas
        if: env.HAS_FIREBASE_SA == 'true'
        run: node scripts/indexnow.mjs --new dist/sitemap.xml --old "$RUNNER_TEMP/sitemap-anterior.xml"
